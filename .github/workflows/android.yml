name: Android

on:
  push:
    branches: [main, master]
    paths-ignore: ['supabase/**', '**.md']
  # Every pull request runs this: its job is a required check on main, and a skipped run never reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Supabase settings are optional; without them the build simply hides cloud sync.
      - name: Unit tests and debug build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: ./gradlew testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
