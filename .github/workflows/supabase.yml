name: Supabase

# Validates every migration on a throwaway local Supabase stack (security tests, re-runs, and an
# upgrade over existing data) and tests the Edge Functions. On push to the main branch, it applies
# the migrations to the real project and deploys the Edge Functions, after approval in the
# `production` environment. Pull requests never see the deploy secrets; preview pending
# migrations locally with `supabase db push --dry-run`. The functions' secrets are set once by
# hand, see supabase/README.md.
#
# Deploying needs (Settings → Environments → production; only the main branch may deploy):
#   variable SUPABASE_PROJECT_ID     the project ref, e.g. abcdefghijklmnopqrst (repository variable)
#   secret   SUPABASE_ACCESS_TOKEN   https://supabase.com/dashboard/account/tokens
#   secret   SUPABASE_DB_PASSWORD    optional, the database password of the project
# Without them only the validation jobs run.
#
# Actions are pinned to commit SHAs and the Supabase CLI to a version, so a moved tag or a new
# release can't reach the deploy token unreviewed.

on:
  push:
    branches: [main, master]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0
      - name: Apply all migrations to a fresh database
        run: supabase start -x studio,imgproxy,vector,logflare,mailpit,edge-runtime,storage-api,postgres-meta,supavisor
      - name: Security tests (pgTAP, supabase/tests)
        run: supabase test db
      - name: Migrations are re-runnable and leave existing data alone
        env:
          DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/fixtures/sample_ledgers.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -v phase=before -f supabase/fixtures/upgrade_check.sql
          for f in supabase/migrations/*.sql; do
            psql "$DB" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$DB" -v ON_ERROR_STOP=1 -q -v phase=after -f supabase/fixtures/upgrade_check.sql
      - run: supabase stop --no-backup

  # This change's new migrations, applied to a database that holds data in the schema before
  # them: the base commit's migrations with its supabase/fixtures/sample_ledgers.sql. That is
  # what `db push` does to the real project. Skipped when the base has no sample data yet.
  upgrade:
    runs-on: ubuntu-latest
    env:
      DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Find the schema before this change
        id: base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE:supabase/fixtures/sample_ledgers.sql" 2>/dev/null; then
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "The base commit ($BASE) has no sample data; nothing to upgrade from."
          fi
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        if: steps.base.outputs.sha
        with:
          version: 2.117.0
      - name: Start the old schema with its sample data
        if: steps.base.outputs.sha
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          cd "$RUNNER_TEMP/base"
          supabase start -x studio,imgproxy,vector,logflare,mailpit,edge-runtime,storage-api,postgres-meta,supavisor
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/fixtures/sample_ledgers.sql
      - name: Apply the new migrations and check the data
        if: steps.base.outputs.sha
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -v phase=before -f supabase/fixtures/upgrade_check.sql
          supabase migration up --local
          psql "$DB" -v ON_ERROR_STOP=1 -q -v phase=after -f supabase/fixtures/upgrade_check.sql
          supabase test db
      - if: steps.base.outputs.sha
        run: supabase stop --no-backup

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Edge Function tests
        working-directory: supabase/functions
        run: deno test
      - name: Edge Functions type-check
        working-directory: supabase/functions
        run: deno check play-verify/index.ts play-notifications/index.ts delete-account/index.ts

  deploy:
    needs: [validate, upgrade, functions]
    if: github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.117.0
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
      - name: Apply pending migrations
        run: supabase db push --include-all
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
