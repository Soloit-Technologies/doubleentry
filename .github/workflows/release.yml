name: Release

# Builds the signed Google Play bundle (.aab) when a version tag (v2.0.0, …) is pushed.
#
# Cloud backup is left out of release builds unless these repository variables are set:
#   variable CLOUD_SYNC_ENABLED   true
#   variable SUPABASE_URL         https://<project-ref>.supabase.co
#   variable SUPABASE_ANON_KEY    the project's anon (publishable) key; it is public by design
#   variable GOOGLE_WEB_CLIENT_ID the OAuth web client id for Sign in with Google (public as well)
#
# Signing needs (Settings → Secrets and variables → Actions):
#   secret SIGNING_KEYSTORE_BASE64   the upload keystore, `base64 -w0 upload-key.jks`
#   secret SIGNING_STORE_PASSWORD
#   secret SIGNING_KEY_ALIAS
#   secret SIGNING_KEY_PASSWORD
# Optional, to upload the bundle to the internal testing track as a draft:
#   secret PLAY_SERVICE_ACCOUNT_JSON  a Play Console service account key (JSON)
# The very first bundle of an app must be uploaded by hand in the Play Console.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Upload keystore
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::SIGNING_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Unit tests and signed release bundle
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          CLOUD_SYNC_ENABLED: ${{ vars.CLOUD_SYNC_ENABLED }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew testDebugUnitTest bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Google Play (internal testing, draft)
        if: env.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.soloit.doubleentry
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft
