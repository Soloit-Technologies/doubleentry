name: Supabase health check

# Twice a week, calls sync_control(), the function the app reads before each sync, on the real
# project. It is open to the anon key and runs a database query without touching any user data,
# so a failure here means the app can't reach the backend either.
#
# Uses the SUPABASE_URL and SUPABASE_ANON_KEY repository variables the builds already read; without
# them the job is skipped. GitHub turns scheduled workflows off after 60 days without a commit to
# the repository, and emails a warning first; re-enable it under Actions if that happens.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Call sync_control()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/sync_control" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
