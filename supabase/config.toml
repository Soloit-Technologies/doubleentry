# Supabase CLI configuration (https://supabase.com/docs/guides/local-development/cli/config).
# Only what this project needs; `supabase init --force` regenerates the full template.
# Remote settings are not changed by this file unless you run `supabase config push`.

project_id = "DoubleEntry"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# The app pages through rows 1000 at a time; keep this at 1000 or higher.
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# The desktop app signs in through the system browser, which returns to a local port it opens.
additional_redirect_urls = ["http://127.0.0.1:*/auth/callback"]
# Accounts are created by Sign in with Google (the provider below).
enable_signup = true
minimum_password_length = 8

[auth.email]
# Email and password are for accounts made by hand (internal users, app reviewers); everyone else
# signs up with Google. This setting switches email sign-in off altogether ("Email logins are
# disabled"), so it stays on; the hook below refuses every email sign-up. Accounts made with the
# admin API (the dashboard's Add user, the contract tests) don't pass through it.
enable_signup = true
otp_length = 6
otp_expiry = 3600

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"

# Sign in with Google: the Android app sends a Google ID token (grant_type=id_token). client_id is
# the OAuth web client id the tokens are issued for; the secret is used by browser sign-in, which
# the desktop app does (grant_type=pkce).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Google Play's notifications come from Pub/Sub, which can't send a Supabase JWT; the function
# checks a shared secret instead (see functions/play-notifications).
[functions.play-notifications]
verify_jwt = false
